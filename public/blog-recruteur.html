<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Recruteur | Indebel</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css?v=1785654755222">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div id="header-placeholder" data-src="/components/header-recruteur.html"></div>

    <main>
        <section class="blog-hero" style="position: relative; padding: 100px 0 60px; text-align: center; background-color: #f2fdff; z-index: 10; overflow: hidden;">
            <div class="container" style="position: relative; z-index: 2;">
                <span style="display: inline-block; padding: 6px 14px; background: rgba(251, 100, 28, 0.1); color: #FB641C; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px;">Recruteur</span>
                <h1 style="font-size: 3.5rem; font-weight: 800; color: #082151; margin-bottom: 20px; line-height: 1.2;">Le Blog <span style="color: #044CF3;">Indebel</span></h1>
                <p style="font-size: 1.2rem; color: #64748b; max-width: 600px; margin: 0 auto;">Conseils RH, gestion de talents freelances et optimisation de vos ressources.</p>
            </div>
            <!-- Decorative Elements -->

            <div style="position: absolute; bottom: -50px; left: -50px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(4,76,243,0.05) 0%, rgba(255,255,255,0) 70%); border-radius: 50%; z-index: 1;"></div>
        </section>

        <section class="blog-list-section" style="padding: 60px 0;">
            <div class="container">
                <div class="blog-grid" id="blog-list-recruteur"
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
                    <!-- Loaded via blog-loader.js -->
                </div>
                <div id="pagination-recruteur"></div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder" data-src="/components/footer-recruteur.html"></div>

    <script src="js/layout-loader.js?v=20260801-header-footer-2"></script>
    <script src="js/blog-loader.js?v=1785654755222"></script>
    <script src="js/main.js"></script>
</body>

</html>
