<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Indebel</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css?v=1785654755222">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .article-hero {
            padding: 140px 0 60px;
            background-color: #f2fdff;
            text-align: center;
        }

        .article-hero h1 {
            font-size: 3rem;
            color: #45485f;
            font-weight: 700;
            margin-bottom: 20px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .article-meta {
            color: #627C89;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .article-section {
            background-color: #f2fdff;
            padding: 60px 0 100px;
        }

        .article-content-wrapper {
            max-width: 800px;
            margin: 0 auto;
        }

        .article-main-image {
            width: 100%;
            height: 400px;
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .article-body {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #45485f;
        }

        .article-body p {
            margin-bottom: 25px;
        }

        .back-to-blog {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 40px;
            transition: transform 0.3s ease;
        }

        .back-to-blog:hover {
            transform: translateX(-5px);
        }
    </style>
</head>

<body class="article-page">
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main id="articleContainer">
        <div style="padding: 200px 0; text-align: center;">
            <p style="color: #627C89;">Chargement de l'article...</p>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script src="js/layout-loader.js?v=20260801-header-footer-2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                window.location.href = '/blog';
                return;
            }

            try {
                // Fetch the article details via an API (using ID)
                const res = await fetch(`/api/blog-article?id=${id}`);
                if (!res.ok) throw new Error('Article not found');

                const p = await res.json();

                document.title = `${p.title} - Indebel`;

                const main = document.getElementById('articleContainer');
                main.innerHTML = `
                    <section class="article-hero">
                        <div class="container">
                            <a href="/blog" class="back-to-blog"><i class="fas fa-arrow-left"></i><span>Retour au blog</span></a>
                            <span class="article-reading-label">Lecture Indebel</span>
                            <h1>${p.title}</h1>
                        </div>
                    </section>

                    <section class="article-section">
                        <div class="container">
                            <div class="article-content-wrapper">
                                <div class="article-main-image" style="background-image: url('${p.image_url || 'images/logo.png'}');"></div>
                                <div class="article-body">
                                    ${p.content}
                                    
                                    <nav class="article-navigation" aria-label="Navigation entre les articles">
                                        <div class="article-navigation-previous">
                                            ${p.prev ? `
                                                <a href="/blog-articles?id=${p.prev.id}" class="article-navigation-link">
                                                    <i class="fas fa-arrow-left"></i><span>Article précédent</span>
                                                </a>
                                                <p class="article-navigation-title">${p.prev.title}</p>
                                            ` : ''}
                                        </div>
                                        <div class="article-navigation-next">
                                            ${p.next ? `
                                                <a href="/blog-articles?id=${p.next.id}" class="article-navigation-link">
                                                    <span>Article suivant</span><i class="fas fa-arrow-right"></i>
                                                </a>
                                                <p class="article-navigation-title">${p.next.title}</p>
                                            ` : ''}
                                        </div>
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </section>
                `;
            } catch (err) {
                console.error(err);
                document.getElementById('articleContainer').innerHTML = `
                    <div style="padding: 200px 0; text-align: center;">
                        <h2>Article non trouvé</h2>
                        <p style="color: #627C89; margin-bottom: 30px;">Désolé, nous ne parvenons pas à trouver l'article que vous recherchez.</p>
                        <a href="/blog" class="btn btn-primary">Retour au blog</a>
                    </div>
                `;
            }
        });
    </script>
</body>

</html>
