<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Indebel</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css?v=1785654755222">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-container {
            max-width: 400px;
            width: min(400px, 100%);
            margin: 0;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            display: block;
            width: 132px;
            height: auto;
            margin: 0 auto 20px;
        }

        .auth-header h2 {
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .login-back-link {
            position: absolute;
            top: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 42px;
            padding: 0 14px;
            border: 1px solid #cbdcf8;
            border-radius: 6px;
            background: white;
            color: #082151;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(8, 33, 81, 0.08);
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            display: inline-grid;
            width: 34px;
            height: 34px;
            place-items: center;
            transform: translateY(-50%);
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #52647d;
            cursor: pointer;
        }

        .password-toggle:hover { background: #eef4ff; color: #044cf3; }

        @media (max-width: 576px) {
            .login-back-link { top: 16px; left: 16px; }
            .auth-container { padding: 28px 22px; }
        }

        .login-page {
            display: grid;
            min-height: 100svh;
            place-items: center;
            padding: 88px 16px 28px;
            position: relative;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        #errorMsg {
            color: red;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>

<body class="login-page" style="background-color: #f4f6f9;">

    <a href="/" class="login-back-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Retour à l'accueil</a>

    <div class="auth-container">
        <div class="auth-header">
            <img src="images/logo.png" alt="Indebel" class="auth-logo">
            <h2>Se connecter</h2>
            <p>Accédez à votre compte Indebel</p>
        </div>

        <div id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <div class="password-field">
                    <input type="password" id="password" required>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Afficher le mot de passe" aria-pressed="false" title="Afficher le mot de passe">
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Connexion</button>
        </form>

    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');

        passwordToggle.addEventListener('click', function () {
            const isVisible = passwordInput.type === 'text';
            passwordInput.type = isVisible ? 'password' : 'text';
            this.setAttribute('aria-pressed', String(!isVisible));
            this.setAttribute('aria-label', isVisible ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
            this.setAttribute('title', isVisible ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
            this.querySelector('i').className = isVisible ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, mot_de_passe: password })
                });

                const data = await res.json();

                if (data.success && data.data?.user && data.data?.token) {
                    const { user, token } = data.data;
                    const dashboardByRole = {
                        admin: '/admin-classic',
                        employer: '/employer/dashboard',
                        freelancer: '/freelancer/dashboard'
                    };
                    const dashboardPath = dashboardByRole[user.role] || '/';
                    const appUrl = new URL(dashboardPath, window.location.origin);

                    localStorage.setItem('user', JSON.stringify(user));
                    localStorage.setItem('token', token);
                    appUrl.searchParams.set('auth_token', token);
                    window.location.href = appUrl.toString();
                } else {
                    errorMsg.textContent = data.message || data.error || 'Impossible de vous connecter.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Une erreur est survenue.";
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
