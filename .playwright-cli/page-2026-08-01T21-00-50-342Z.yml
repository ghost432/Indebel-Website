      - paragraph [ref=e87]: Indebel est une plateforme de mise en relation technique.
      - paragraph [ref=e88]: "Indebel :"
      - list [ref=e89]:
        - listitem [ref=e90]: n’est ni prestataire de services, ni sous-traitant, ni employeur ;
        - listitem [ref=e91]: n’intervient pas dans les contrats conclus entre utilisateurs ;
        - listitem [ref=e92]: ne participe ni aux paiements ni à l’exécution des prestations.
      - heading "Article 4 — Absence de contrôle et de garantie" [level=3] [ref=e93]
      - paragraph [ref=e94]: "Les Utilisateurs reconnaissent expressément que :"
      - list [ref=e95]:
        - listitem [ref=e96]: Indebel ne vérifie pas systématiquement l’identité, les compétences, les assurances ou la conformité légale des Prestataires ;
        - listitem [ref=e97]: toute vérification éventuelle est non exhaustive, non automatique et non garantie ;
        - listitem [ref=e98]: Indebel ne certifie, ne valide et ne recommande aucun Prestataire.
      - heading "Article 5 — Création de compte" [level=3] [ref=e99]
      - paragraph [ref=e100]: Certaines fonctionnalités nécessitent la création d’un compte.
      - paragraph [ref=e101]: "Chaque Membre :"
      - list [ref=e102]:
        - listitem [ref=e103]: garantit l’exactitude des informations fournies ;
        - listitem [ref=e104]: est seul responsable de leur mise à jour ;
        - listitem [ref=e105]: assume l’ensemble des conséquences liées à l’utilisation de son compte.
      - paragraph [ref=e106]: Indebel se réserve le droit de suspendre ou supprimer un compte sans préavis en cas de fraude, abus ou non-respect des CGU.
      - heading "Article 6 — Conditions Financières" [level=3] [ref=e107]
      - paragraph [ref=e108]:
        - strong [ref=e109]: 6.1 Particuliers
        - text: L’utilisation de la Plateforme est gratuite.
      - paragraph [ref=e110]:
        - strong [ref=e111]: 6.2 Prestataires et Entreprises
        - text: Indebel propose des formules gratuites et payantes. Les fonctionnalités varient selon l’abonnement souscrit.
      - heading "Article 7 — Obligations des Entreprises" [level=3] [ref=e112]
      - paragraph [ref=e113]: "Les Entreprises reconnaissent être seules responsables :"
      - list [ref=e114]:
        - listitem [ref=e115]: du respect de la législation belge en matière de sous-traitance ;
        - listitem [ref=e116]: des obligations fiscales, sociales, TVA, sécurité et assurances ;
        - listitem [ref=e117]: de la vérification préalable des Prestataires.
      - paragraph [ref=e118]: Indebel n’assume aucune obligation de conseil juridique ou de contrôle.
      - heading "Article 8 — Obligations des Prestataires" [level=3] [ref=e119]
      - paragraph [ref=e120]: "Chaque Prestataire s’engage à :"
      - list [ref=e121]:
        - listitem [ref=e122]: être en règle sur les plans légal, fiscal et social ;
        - listitem [ref=e123]: disposer des assurances professionnelles obligatoires ;
        - listitem [ref=e124]: respecter la législation belge applicable à la sous-traitance ;
        - listitem [ref=e125]: fournir des informations exactes et sincères.
      - paragraph [ref=e126]: Le Prestataire demeure seul responsable de son statut et de ses obligations.
      - heading "Article 9 — Absence de lien de subordination" [level=3] [ref=e127]
      - paragraph [ref=e128]: "Les Parties reconnaissent qu’il n’existe :"
      - list [ref=e129]:
        - listitem [ref=e130]: aucun lien de subordination ;
        - listitem [ref=e131]: aucun mandat ;
        - listitem [ref=e132]: aucune relation d’agence ou d’emploi entre Indebel et les Utilisateurs.
      - heading "Article 10 — Responsabilité" [level=3] [ref=e133]
      - paragraph [ref=e134]: "Indebel décline toute responsabilité, notamment en cas de :"
      - list [ref=e135]:
        - listitem [ref=e136]: litige entre utilisateurs ;
        - listitem [ref=e137]: défaut de paiement ou d’exécution ;
        - listitem [ref=e138]: non-conformité légale d’un utilisateur ;
        - listitem [ref=e139]: informations erronées ou trompeuses ;
        - listitem [ref=e140]: dommages indirects et directs ou pertes financières.
      - heading "Article 11 — Propriété Intellectuelle" [level=3] [ref=e141]
      - paragraph [ref=e142]: L’ensemble du contenu de la Plateforme est protégé. Toute reproduction non autorisée est interdite.
      - heading "Article 12 — Données Personnelles" [level=3] [ref=e143]
      - paragraph [ref=e144]: Dreambis SRL est responsable du traitement des données. Les traitements sont effectués conformément au RGPD.
      - paragraph [ref=e145]:
        - text: "Droits : accès, rectification, suppression, opposition, portabilité. Contact :"
        - strong [ref=e146]: contact@indebel.be
      - heading "Article 13 — Cookies" [level=3] [ref=e147]
      - paragraph [ref=e148]: La Plateforme utilise uniquement des cookies techniques et statistiques. Les préférences peuvent être gérées via le navigateur.
      - heading "Article 14 — Droit Applicable et Juridiction" [level=3] [ref=e149]
      - paragraph [ref=e150]: Les présentes CGU sont soumises au droit belge. Tout litige relève de la compétence exclusive des tribunaux de Mons.
      - heading "Article 15 — Acceptation des CGU" [level=3] [ref=e151]
      - paragraph [ref=e152]: L’Utilisateur reconnaît avoir pris connaissance des présentes CGU et les accepter sans réserve.
