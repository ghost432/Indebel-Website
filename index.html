    <script>
      (function() {
        const apiBase = 'https://pro.indebel.be/api';
        const lockText = 'Se connecter pour voir cette information.';
        const icon = {
          mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 4 16 0 0 16-16 0z"/><path d="m22 6-10 7L2 6"/></svg>',
          phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.32 1.78.59 2.63a2 2 0 0 1-.45 2.11L8 9.71a16 16 0 0 0 6 6l1.24-1.24a2 2 0 0 1 2.11-.45c.85.27 1.73.47 2.63.59A2 2 0 0 1 22 16.92z"/></svg>',
          map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
          image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>',
          calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/></svg>',
          bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m13 2-10 12h9l-1 8 10-12h-9l1-8z"/></svg>',
          send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>'
        };

        function isQuoteDetail() { return window.location.pathname.match(/^\/devis\/(\d+)\/?$/); }
        function safe(value) { return value === null || value === undefined || value === '' ? '' : String(value); }
        function escapeHtml(value) { return safe(value).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
        function parseFiles(value) {
          if (!value || value === '[]') return [];
          if (Array.isArray(value)) return value;
          try { const parsed = JSON.parse(value); return Array.isArray(parsed) ? parsed : []; } catch (error) { return []; }
        }
        function formatDate(value) {
          if (!value) return 'Non spécifiée';
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return 'Non spécifiée';
          return date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
        }
        function priority(value) { return ({ normal: 'Normal', urgent: 'Urgent', tres_urgent: 'Très urgent' })[value] || safe(value) || 'Normal'; }
        function contactRow(kind, label, value, locked) {
          const text = value || (locked ? lockText : 'Non renseigné');
          return '<div class="indebel-detail-row' + (value ? '' : ' is-muted') + '"><span class="indebel-detail-icon">' + icon[kind] + '</span><span><strong>' + label + '</strong><em>' + escapeHtml(text) + '</em></span></div>';

        }
        function clickOriginalSubmit() {
          const match = isQuoteDetail();
          if (match && match[1] && window.openIndebelAIDevisModal) {
            window.openIndebelAIDevisModal(match[1]);
            return;
          }
          const buttons = Array.from(document.querySelectorAll('#root button'));
          const button = buttons.find(btn => /Soumettre un devis|Se connecter pour soumettre/.test(btn.innerText || ''));
          if (button) button.click();
          else window.location.href = '/login?redirect=' + window.location.pathname;
        }
        function buildFileStrip(files) {
          if (!files.length) return '';
          return '<div class="indebel-file-strip">' + files.slice(0, 4).map(function(file, index) {
            const src = safe(file.data || file.url || file.src || file.preview);
            const name = escapeHtml(file.name || 'Document ' + (index + 1));
            if (src && (src.indexOf('data:image') === 0 || /\.(jpeg|jpg|gif|png|webp|svg)(\?|$)/i.test(src))) {
              return '<a href="' + escapeHtml(src) + '" target="_blank" rel="noopener" class="indebel-file-thumb"><img src="' + escapeHtml(src) + '" alt="' + name + '"></a>';
            }
            return '<a href="' + escapeHtml(src || '#') + '" target="_blank" rel="noopener" class="indebel-file-doc">' + icon.image + '<span>' + name + '</span></a>';
          }).join('') + '</div>';
        }
        function renderLayout(id, data, authenticated) {
          const existing = document.getElementById('indebel-public-detail-enhancer');
          if (existing) existing.remove();
          const container = document.querySelector('#root .max-w-4xl');
          const firstCard = container && container.querySelector('.bg-white.rounded-xl');
          if (!container || !firstCard || !data) return;

          document.querySelectorAll('.indebel-hidden-original-detail').forEach(el => { el.style.display = ''; el.classList.remove('indebel-hidden-original-detail'); });
          const files = parseFiles(data.fichiers_joints);
          const locked = !authenticated || data.contact_visible === false;
          const location = [data.ville, data.code_postal ? '(' + data.code_postal + ')' : '', data.region].filter(Boolean).join(' ');
          const address = [data.adresse, data.code_postal, data.ville, data.region].filter(Boolean).join(' - ');
          const actionHtml = authenticated
            ? '<button type="button" class="indebel-action-button" id="indebel-submit-proposal">' + icon.send + '<span>Soumettre un devis maintenant</span></button>'
            : '<a class="indebel-action-button" href="/login?redirect=/devis/' + id + '">' + icon.send + '<span>Se connecter pour soumettre</span></a>';

          const wrapper = document.createElement('div');
          wrapper.id = 'indebel-public-detail-enhancer';
          wrapper.innerHTML =
            '<section class="indebel-detail-card indebel-summary-card">' +
              '<div class="indebel-detail-head"><div><p>Demande de devis</p><h1>' + escapeHtml(data.type_travaux || 'Demande de devis') + '</h1><span>' + escapeHtml(location || 'Belgique') + '</span></div><b>' + escapeHtml(data.categorie || 'Travaux') + '</b></div>' +
              '<div class="indebel-detail-grid">' + infoPill('calendar', 'Date début souhaitée', formatDate(data.date_souhaite)) + infoPill('bolt', 'Priorité', priority(data.urgence)) + '</div>' +
              '<div class="indebel-text-block"><strong>Description du projet</strong><p>' + escapeHtml(data.description || 'Aucune description fournie.') + '</p></div>' +
              (data.details_complementaires ? '<div class="indebel-text-block"><strong>Détails complémentaires</strong><p>' + escapeHtml(data.details_complementaires).replace(/\n/g, '<br>') + '</p></div>' : '') +
            '</section>' +
            '<section class="indebel-detail-card indebel-contact-card">' +
              '<div class="indebel-detail-head"><div><p>Coordonnées protégées</p><h2>Contact et documents du client</h2></div>' + (locked ? '<a href="/login?redirect=/devis/' + id + '" class="indebel-small-login">Se connecter</a>' : '<b class="is-ok">Accès connecté</b>') + '</div>' +
              '<div class="indebel-detail-grid">' + contactRow('mail', 'Email', safe(data.email), locked) + contactRow('phone', 'Téléphone', safe(data.telephone), locked) + contactRow('map', 'Adresse', locked ? '' : address, locked) + contactRow('image', 'Photos et documents', files.length ? files.length + ' fichier(s) disponible(s)' : '', locked) + '</div>' +
              buildFileStrip(files) +
              '<p class="indebel-contact-note">Les coordonnées privées sont réservées aux prestataires connectés afin de protéger les demandes des particuliers.</p>' +
            '</section>' +
            '<section class="indebel-detail-card indebel-action-card">' +
              '<div><span>Offre publiée le</span><strong>' + formatDate(data.created_at) + '</strong></div>' + actionHtml +
            '</section>';

          firstCard.insertAdjacentElement('beforebegin', wrapper);
          firstCard.classList.add('indebel-hidden-original-detail');
          firstCard.style.display = 'none';
          const submit = document.getElementById('indebel-submit-proposal');
          if (submit) submit.addEventListener('click', clickOriginalSubmit);
        }
        async function loadQuoteDetail() {
          const match = isQuoteDetail();
          if (!match) {
            const existing = document.getElementById('indebel-public-detail-enhancer');
            if (existing) existing.remove();
            document.querySelectorAll('.indebel-hidden-original-detail').forEach(el => { el.style.display = ''; el.classList.remove('indebel-hidden-original-detail'); });
            return;
          }
          const id = match[1];
          const token = localStorage.getItem('token');
          let data = null;
          let authenticated = false;
          if (token) {
            try {
              const response = await fetch(apiBase + '/devis-soumis/demande-disponible/' + id, { headers: { Authorization: 'Bearer ' + token } });
              const json = await response.json();
              if (response.ok && json.success) { data = json.data; authenticated = true; }
            } catch (error) {}
          }
          if (!data) {
            try {
              const response = await fetch(apiBase + '/devis/public/' + id);
              const json = await response.json();
              if (response.ok && json.success) data = json.data;
            } catch (error) {}
          }
          renderLayout(id, data, authenticated);
        }

,243,.18)}@media(max-width:700px){.indebel-detail-card{border-radius:18px;padding:1rem}.indebel-detail-head,.indebel-action-card{flex-direction:column;align-items:stretch}.indebel-detail-head b,.indebel-small-login,.indebel-detail-head .is-ok,.indebel-action-button{width:100%}.indebel-detail-grid,.indebel-file-strip{grid-template-columns:1fr}.indebel-detail-row{padding:.9rem}}';
          document.head.appendChild(style);

        let lastPath = '';
        function tuneDetailHeader() {
          const match = isQuoteDetail();
          const nav = document.querySelector('nav.bg-white');
          if (!nav) return;
          const brandText = nav.querySelector('a[href="/"] span');
          const row = nav.querySelector('.flex.justify-between.items-center');
          const existing = document.getElementById('indebel-header-home-link');
          if (!match) {
            if (brandText) brandText.style.display = '';
            if (existing) existing.remove();
            return;
          }
          if (brandText) brandText.style.display = 'none';
          if (row && !existing) {
            const link = document.createElement('a');
            link.id = 'indebel-header-home-link';
            link.href = 'https://indebel.be/';
            link.textContent = 'Accueil';
            link.className = 'indebel-header-home-link';
            row.appendChild(link);
          }
        }
        function tick() {
          injectStyles();
          tuneDetailHeader();
          if (window.location.pathname !== lastPath || !document.getElementById('indebel-public-detail-enhancer')) {
            lastPath = window.location.pathname;
            setTimeout(loadQuoteDetail, 550);
          }
        }
        window.addEventListener('load', tick);
        window.addEventListener('popstate', tick);
        setInterval(tick, 1200);
      })();

      <!-- Admin Status Widget -->
    <script>
      (function() {
        function injectAdminWidget() {
          const isDevisPage = window.location.pathname.match(/^\/admin\/devis\/(\d+)$/);
          let widget = document.getElementById('indebel-admin-widget');
          
          if (isDevisPage) {
            if (!widget) {
              const id = isDevisPage[1];
              widget = document.createElement('div');
              widget.id = 'indebel-admin-widget';
              widget.innerHTML = `
                <div style="position:fixed;bottom:20px;right:20px;background:white;padding:15px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,0.1);z-index:9999;border:1px solid #e2e8f0;font-family:sans-serif;width:250px;">
                  <h4 style="margin:0 0 10px;font-size:14px;color:#0f172a;display:flex;align-items:center;gap:6px;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Changer le Statut
                  </h4>
                  <select id="admin-status-select" style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;outline:none;cursor:pointer;font-size:13px;background:#f8fafc;">
                    <option value="">Sélectionnez un statut...</option>
                    <option value="attente">Remettre En attente</option>
                    <option value="traiter">Marquer comme Traitée</option>
                    <option value="valider">Marquer comme Validée</option>
                    <option value="refuser">Marquer comme Refusée</option>
                  </select>
                  <div id="admin-status-msg" style="margin-top:8px;font-size:12px;color:#10b981;display:none;font-weight:600;">Statut mis à jour !</div>
                </div>
              `;
              document.body.appendChild(widget);

              document.getElementById('admin-status-select').addEventListener('change', async function(e) {
                const action = e.target.value;
                if (!action) return;
                
                const token = localStorage.getItem('token');
                if (!token) {
                  alert("Vous devez être connecté en tant qu'admin.");
                  return;
                }

                try {
                  const res = await fetch('https://pro.indebel.be/api/devis/' + id + '/' + action, {
                    method: 'PUT',
                    headers: {
                      'Authorization': 'Bearer ' + token,
                      'Content-Type': 'application/json'
                    }
                  });
                  if (res.ok) {
                    const msg = document.getElementById('admin-status-msg');
                    msg.style.display = 'block';
                    setTimeout(() => { msg.style.display = 'none'; window.location.reload(); }, 1200);
                  } else {
                    alert('Erreur lors de la mise à jour.');
                  }
                } catch (err) {
                  alert('Erreur réseau.');
                }
              });
            }
          } else {
            if (widget) widget.remove();
          }
        }

        // SPA route checking
        setInterval(injectAdminWidget, 1000);
      })();
    </script>

    <script>
      (function(){
        const visibilityIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
        function isAdminDevisList(){ return window.location.pathname.replace(/\/$/,'') === '/admin/devis'; }
        function token(){ return localStorage.getItem('token') || sessionStorage.getItem('token') || ''; }
        function formatDate(value){ if(!value) return 'Jamais'; const d = new Date(value); if(Number.isNaN(d.getTime())) return 'Jamais'; return d.toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
        function escapeHtml(value){ return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function findHost(anchor){ return anchor.closest('tr') || anchor.closest('article,.rounded-2xl,.rounded-xl,.rounded-lg,.bg-white,.shadow-sm,li') || anchor.parentElement; }
        function addButton(anchor, id){
          const host = findHost(anchor);
          if(!host || host.dataset.visibilityDevisId === id) return;
          if(host.querySelector('[data-visibility-button="'+id+'"]')) return;
          host.dataset.visibilityDevisId = id;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'indebel-visibility-button';
          btn.dataset.visibilityButton = id;
          btn.innerHTML = visibilityIcon + '<span>Visibilité</span>';
          btn.addEventListener('click', function(event){ event.preventDefault(); event.stopPropagation(); openVisibilityModal(id); });
          if(host.tagName === 'TR'){
            const cells = host.querySelectorAll('td');
            (cells[cells.length - 1] || host).appendChild(btn);
          } else {
            host.style.position = host.style.position || 'relative';
            host.appendChild(btn);
          }
        }
        function injectButtons(){
          if(!isAdminDevisList()) return;
          document.querySelectorAll('a[href*="/admin/devis/"]').forEach(anchor => {
            const href = anchor.getAttribute('href') || '';
            const match = href.match(/\/admin\/devis\/(\d+)/);
            if(match) addButton(anchor, match[1]);
          });
        }
        async function openVisibilityModal(id){
          closeVisibilityModal();
          const backdrop = document.createElement('div');
          backdrop.className = 'indebel-visibility-modal-backdrop';
          backdrop.id = 'indebel-visibility-modal';
          backdrop.innerHTML = '<div class="indebel-visibility-modal"><div class="indebel-visibility-modal-head"><div><p>Statistiques de visibilité</p><h3>Demande #'+escapeHtml(id)+'</h3></div><button class="indebel-visibility-close" type="button" aria-label="Fermer">×</button></div><div class="indebel-visibility-body"><div class="indebel-visibility-empty">Chargement des vues...</div></div></div>';
          document.body.appendChild(backdrop);
          backdrop.querySelector('.indebel-visibility-close').addEventListener('click', closeVisibilityModal);
          backdrop.addEventListener('click', event => { if(event.target === backdrop) closeVisibilityModal(); });
          try{
            const response = await fetch('/api/devis/'+id+'/visibility', { headers: { Authorization: 'Bearer '+token(), Accept: 'application/json' }});
            const json = await response.json();
            if(!response.ok || !json.success) throw new Error(json.message || 'Impossible de charger les vues');
            renderVisibility(backdrop, json.data || {});
          } catch(error){
            const body = backdrop.querySelector('.indebel-visibility-body');
            body.innerHTML = '<div class="indebel-visibility-error">'+escapeHtml(error.message || 'Erreur réseau')+'</div>';
          }
        }
        function renderVisibility(backdrop, data){
          const summary = data.summary || {};
          const viewers = Array.isArray(data.viewers) ? data.viewers : [];
          const body = backdrop.querySelector('.indebel-visibility-body');
          body.innerHTML = '<div class="indebel-visibility-stats"><div class="indebel-visibility-stat"><span>Vues connectées</span><strong>'+Number(summary.total_views || 0)+'</strong></div><div class="indebel-visibility-stat"><span>Personnes uniques</span><strong>'+Number(summary.unique_viewers || 0)+'</strong></div><div class="indebel-visibility-stat"><span>Dernière vue</span><strong style="font-size:14px">'+escapeHtml(formatDate(summary.last_viewed_at))+'</strong></div></div><div class="indebel-visibility-hints"><div class="indebel-visibility-hint"><b>Vues connectées</b>Total des ouvertures faites par des utilisateurs connectés. Une même personne peut compter plusieurs fois.</div><div class="indebel-visibility-hint"><b>Personnes uniques</b>Nombre de comptes connectés différents ayant consulté cette demande au moins une fois.</div></div>' + (viewers.length ? '<div class="indebel-visibility-list">'+viewers.map(v => '<div class="indebel-visibility-viewer"><div><b>'+escapeHtml(v.display_name || v.email || ('Utilisateur #'+v.user_id))+'</b><em>'+escapeHtml(v.email || '')+' · '+escapeHtml(v.role || 'compte')+'</em><em>Première vue : '+escapeHtml(formatDate(v.first_viewed_at))+' · Dernière vue : '+escapeHtml(formatDate(v.last_viewed_at))+'</em></div><span class="indebel-visibility-pill">'+Number(v.views_count || 0)+' vue(s)</span></div>').join('')+'</div>' : '<div class="indebel-visibility-empty">Aucune vue connectée enregistrée pour cette demande.</div>');
        }
        function closeVisibilityModal(){ const modal = document.getElementById('indebel-visibility-modal'); if(modal) modal.remove(); }
        const rerun = () => setTimeout(injectButtons, 250);
        ['pushState','replaceState'].forEach(method => { const original = history[method]; history[method] = function(){ const result = original.apply(this, arguments); rerun(); return result; }; });
        window.addEventListener('popstate', rerun);
        const observer = new MutationObserver(rerun);
        observer.observe(document.documentElement, { childList:true, subtree:true });
        setInterval(injectButtons, 1500);
        rerun();
      })();
    </script>

          try {
            const response = await fetch('/api/devis/'+id+'/visibility', { headers: { Authorization: 'Bearer '+getToken(), Accept: 'application/json' } });

            if(!response.ok || !json.success) throw new Error(json.message || 'Impossible de charger les statistiques');
            render(backdrop, json.data || {});
          } catch(error) {
            backdrop.querySelector('.indebel-visibility-body').innerHTML = '<div class="indebel-visibility-error">'+esc(error.message || 'Erreur réseau')+'</div>';
          }

        function render(backdrop, data){

          const body = backdrop.querySelector('.indebel-visibility-body');
          body.innerHTML = '<div class="indebel-visibility-stats"><div class="indebel-visibility-stat"><span>Vues connectées</span><strong>'+Number(summary.total_views || 0)+'</strong></div><div class="indebel-visibility-stat"><span>Personnes uniques</span><strong>'+Number(summary.unique_viewers || 0)+'</strong></div><div class="indebel-visibility-stat"><span>Dernière vue</span><strong style="font-size:14px">'+esc(date(summary.last_viewed_at))+'</strong></div></div><div class="indebel-visibility-hints"><div class="indebel-visibility-hint"><b>Vues connectées</b>Total des ouvertures faites par des utilisateurs connectés. Une même personne peut compter plusieurs fois.</div><div class="indebel-visibility-hint"><b>Personnes uniques</b>Nombre de comptes connectés différents ayant consulté cette demande au moins une fois.</div></div>' + (viewers.length ? '<div class="indebel-visibility-list">'+viewers.map(v => '<div class="indebel-visibility-viewer"><div><b>'+esc(v.display_name || v.email || ('Utilisateur #'+v.user_id))+'</b><em>'+esc(v.email || '')+' · '+esc(v.role || 'compte')+'</em><em>Première vue : '+esc(date(v.first_viewed_at))+' · Dernière vue : '+esc(date(v.last_viewed_at))+'</em></div><span class="indebel-visibility-pill">'+Number(v.views_count || 0)+' vue(s)</span></div>').join('')+'</div>' : '<div class="indebel-visibility-empty">Aucune vue connectée enregistrée pour cette demande.</div>');

        const observer = new MutationObserver(() => setTimeout(scan, 80));
        observer.observe(document.documentElement, { childList:true, subtree:true });
        ['pushState','replaceState'].forEach(method => { const original = history[method]; history[method] = function(){ const result = original.apply(this, arguments); setTimeout(scan, 150); return result; }; });

    <script>
      (function(){
        function onRoute(path){ return window.location.pathname.replace(/\/$/,'') === path; }
        function getToken(){ return localStorage.getItem('token') || sessionStorage.getItem('token') || ''; }
        function parseJwt(t){ 
          try{
            const base64Url = t.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
          }catch(e){return null;} 
        }
        
        window.indebelUsersPartenariats = window.indebelUsersPartenariats || {};
        const origFetch = window.fetch;
        window.fetch = async function(...args){
          const res = await origFetch.apply(this, args);
          const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url ? args[0].url : '');
          if(url.includes('/api/users') && !url.includes('/stats')){
            res.clone().json().then(d => {
              if(d && d.data && Array.isArray(d.data)){
                window.indebelAllUsersData = d.data;
                d.data.forEach(u => {
                  if(u.nom_partenariat) {
                    if(u.email) window.indebelUsersPartenariats[u.email.toLowerCase()] = u.nom_partenariat;
                    if(u.id) window.indebelUsersPartenariats[String(u.id)] = u.nom_partenariat;
                    const nameKey = (u.prenom+' '+u.nom).trim().toLowerCase();
                    if(nameKey) window.indebelUsersPartenariats[nameKey] = u.nom_partenariat;
                  }
                });
              }
            }).catch(()=>{});
          }
          return res;
        };

        let statsLoaded = false;
        
        function checkAndInject(){
          const token = getToken();
          if(!token) return;
          const user = parseJwt(token);
          if(!user) return;
          
          // Restrict sidebar and pages for Sub-Admins
          if(user.role === 'admin' && user.email !== 'noreply@indebel.be'){
            let perms = { pages: [] };
            if (user.admin_permissions) {
               try { perms = typeof user.admin_permissions === 'string' ? JSON.parse(user.admin_permissions) : user.admin_permissions; } catch(e){}
            }
            const allowedPages = perms.pages || [];
            
            // Map text content to page keys
            const pageMap = {
               'statistiques': 'stats',
               'utilisateurs': 'users',
               'support': 'support',
               'missions': 'missions',
               'factures': 'factures',
               'devis': 'devis',
               'demandes': 'devis'
            };

            const alwaysHideWords = [
               'avis prestataires', 'secteurs', 'compétences', 'competences',
               "vérification", "verification", 'forfaits',
               'pwa', 'analytics', 'labels indebel', 'label indebel', 'labels'
            ];

            // Continually enforce sidebar restrictions against React re-renders
            setInterval(() => {
               const nav = document.querySelector('nav') || document;
               const elements = nav.querySelectorAll('a, button, div.cursor-pointer, [role="button"], li, span, h3, p');
               elements.forEach(el => {
                  if (el.children.length <= 3) {
                     const text = el.textContent.toLowerCase().trim();
                     if (!text) return;
                     
                     // Hide non-granted pages based on pageMap
                     let shouldHide = false;
                     for(const [name, key] of Object.entries(pageMap)) {
                        if(text.includes(name) && !allowedPages.includes(key)) {
                           shouldHide = true;
                        }
                     }

                     // Hide always hidden words
                     if (alwaysHideWords.some(w => text === w || text.includes(w))) {
                        shouldHide = true;
                     }

                     if (shouldHide) {
                        let target = el;
                        let ascents = 0;
                        while (target.parentElement && target.parentElement !== nav && target.parentElement.textContent.length < text.length + 50 && ascents < 3) {
                           target = target.parentElement;
                           ascents++;
                        }
                        if (target.style.display !== 'none') {
                           target.style.setProperty('display', 'none', 'important');
                        }
                     }
                  }
               });
            }, 500);

            // Block access to forbidden pages by emptying main
            const routeMap = {
               '/admin/stats': 'stats',
               '/admin/users': 'users',
               '/admin/support': 'support',
               '/admin/missions': 'missions',
               '/admin/factures': 'factures',
               '/admin/devis': 'devis',
               '/admin/demandes': 'devis'
            };
            
            const alwaysBlockRoutes = [
               '/admin/avis', '/admin/secteurs', '/admin/competences',
               '/admin/verifications', '/admin/verification',
               '/admin/forfaits', '/admin/pwa', '/admin/analytics',
               '/admin/labels'
            ];

            const currentPath = window.location.pathname.toLowerCase();
            let isBlocked = false;
            
            if(alwaysBlockRoutes.some(r => currentPath.includes(r))) {
               isBlocked = true;
            } else {
               for(const [route, key] of Object.entries(routeMap)){
                  if(currentPath.includes(route) && !allowedPages.includes(key)){
                     isBlocked = true;
                  }
               }
            }

            if(isBlocked) {
               const main = document.querySelector('main');
               if(main && !main.querySelector('.indebel-forbidden')){
                  main.innerHTML = '<div class="indebel-forbidden" style="padding:40px;text-align:center"><h2>Accès Interdit</h2><p>Vous n\'avez pas la permission de voir cette page.</p></div>';
               }
            }
          }
          
          if(onRoute('/admin/users')){
            if(!document.getElementById('indebel-mobile-fix')) {
               const style = document.createElement('style');
               style.id = 'indebel-mobile-fix';
               style.innerHTML = `
                 @media (max-width: 768px) {
                   /* Header flex fix (keeps title and buttons responsive) */
                   main .flex.items-center.justify-between, main .admin-users-header {
                      flex-direction: column !important;
                      align-items: flex-start !important;
                      gap: 15px !important;
                   }
                   
                   /* Fix action buttons container */
                   #indebel-admin-actions { 
                      width: 100% !important; 
                      flex-direction: column !important; 
                   }
                   .indebel-super-btn { 
                      width: 100% !important; 
                      margin-top: 10px !important; 
                      text-align: center; 
                      justify-content: center; 
                   }
                   #indebel-sa-btn {
                      margin-left: 0 !important;
                      margin-top: 10px !important;
                   }

                   /* Allow horizontal scrolling for the user list/table instead of breaking it into columns */
                   main .bg-white.rounded-lg, main .border.border-gray-200 {
                      overflow-x: auto !important;

                  <div>
                    <label style="display:block;font-size:11px;font-weight:800;color:#64748b;margin-bottom:4px;">MONTANT TVA (€)</label>
                    <div id="ai-montant-tva-display" style="padding:8px 10px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;font-weight:700;font-size:14px;color:#475569;">0.00 €</div>
                  </div>
                  <div>
                    <label style="display:block;font-size:11px;font-weight:800;color:#044CF3;margin-bottom:4px;">TOTAL TTC (€)</label>
                    <div id="ai-montant-ttc-display" style="padding:8px 10px;background:#dbeafe;border:1px solid #bfdbfe;border-radius:8px;font-weight:900;font-size:15px;color:#044CF3;">0.00 €</div>
                  </div>
                </div>

                <!-- Delivery Time -->
                <div>
                  <label style="display:block;font-size:12px;font-weight:800;color:#0f172a;margin-bottom:4px;">Délai d'exécution estimé</label>
                  <input type="text" id="ai-delai" placeholder="ex: 3 jours, 1 semaine..." style="width:100%;padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:13px;box-sizing:border-box;" value="3 à 5 jours ouvrables">
                </div>

                <!-- AI Instructions & Trigger Button -->
                <div style="background:linear-gradient(135deg, #eff6ff, #faf5ff);border:1px dashed #bfdbfe;border-radius:16px;padding:14px;">
                  <label style="display:block;font-size:12px;font-weight:800;color:#1e40af;margin-bottom:6px;">
                    Consignes spécifiques pour l'IA (Optionnel)
                  </label>
                  <input type="text" id="ai-instructions" placeholder="ex: Inclure 2 couches de peinture, préparation du sol, matériel compris..." style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;margin-bottom:10px;box-sizing:border-box;">

                  <button type="button" id="trigger-ai-btn" style="width:100%;padding:12px;border-radius:12px;border:0;background:linear-gradient(135deg, #044CF3, #7c3aed);color:#fff;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 8px 20px rgba(4,76,243,0.25);display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/></svg>
                    <span>✨ Rédiger automatiquement le devis avec l'IA</span>
                  </button>
                </div>

                <!-- Quote Description Textarea -->
                <div>
                  <label style="display:block;font-size:12px;font-weight:800;color:#0f172a;margin-bottom:4px;">
                    Description détaillée de la prestation (Générée ou personnalisée) <span style="color:#ef4444;">*</span>
                  </label>
                  <textarea id="ai-description" rows="5" placeholder="Le détail des prestations apparaîtra ici..." style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font-size:13px;line-height:1.5;box-sizing:border-box;font-family:inherit;"></textarea>
                </div>

                <!-- Action buttons -->
                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:4px;">
                  <button type="button" id="cancel-ai-modal-btn" style="padding:10px 18px;border-radius:12px;border:1px solid #cbd5e1;background:#f8fafc;color:#475569;font-weight:700;font-size:13px;cursor:pointer;">Annuler</button>
                  <button type="button" id="submit-devis-final-btn" style="padding:10px 22px;border-radius:12px;border:0;background:#16a34a;color:#ffffff;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 8px 20px rgba(22,163,74,0.3);display:flex;align-items:center;gap:6px;">
                    <span>🚀 Envoyer le devis au client</span>
                  </button>
                </div>

              </div>
            </div>
          `;

          document.body.appendChild(backdrop);

          // Event listeners
          const closeBtn = document.getElementById('close-ai-modal-btn');
          const cancelBtn = document.getElementById('cancel-ai-modal-btn');
          const closeFn = () => backdrop.remove();
          closeBtn.onclick = closeFn;
          cancelBtn.onclick = closeFn;

          // TVA Selector handlers
          const tvaBtns = backdrop.querySelectorAll('.tva-btn');
          const tvaInput = document.getElementById('ai-taux-tva');
          const htInput = document.getElementById('ai-montant-ht');
          const tvaDisplay = document.getElementById('ai-montant-tva-display');
          const ttcDisplay = document.getElementById('ai-montant-ttc-display');

          function updateCalculations() {
            const rate = parseFloat(tvaInput.value) || 0;
            const ht = parseFloat(htInput.value) || 0;
            const tva = Math.round((ht * rate / 100) * 100) / 100;
            const ttc = Math.round((ht + tva) * 100) / 100;

            tvaDisplay.textContent = tva.toFixed(2) + ' €';
            ttcDisplay.textContent = ttc.toFixed(2) + ' €';
          }

          tvaBtns.forEach(btn => {
            btn.onclick = function() {
              tvaBtns.forEach(b => {
                b.classList.remove('active');
                b.style.borderColor = '#cbd5e1';
                b.style.background = '#fff';
                b.style.color = '#000';
              });
              this.classList.add('active');
              this.style.borderColor = '#044CF3';
              this.style.background = '#eff6ff';
              this.style.color = '#044CF3';
              tvaInput.value = this.dataset.tva;
              updateCalculations();
            };
          });

          htInput.oninput = updateCalculations;
          updateCalculations();

          // Trigger AI Generation Button
          const triggerAiBtn = document.getElementById('trigger-ai-btn');
          triggerAiBtn.onclick = async function() {
            const btnSpan = triggerAiBtn.querySelector('span');
            const oldText = btnSpan.textContent;
            btnSpan.textContent = '⚡ Génération par IA en cours (ai.lestagiaire.be)...';
            triggerAiBtn.disabled = true;
            triggerAiBtn.style.opacity = '0.7';

            try {
              const res = await fetch(API_BASE + '/devis-soumis/generate-ai-devis', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                  demande_devis_id: demandeId,
                  taux_tva: parseFloat(tvaInput.value) || 21,
                  instructions_supplementaires: document.getElementById('ai-instructions').value
                })
              });

              const json = await res.json();
              if (json.success && json.data) {
                if (json.data.montant_ht) htInput.value = json.data.montant_ht;
                if (json.data.delai_realisation) document.getElementById('ai-delai').value = json.data.delai_realisation;
                if (json.data.description) document.getElementById('ai-description').value = json.data.description;
                updateCalculations();
              } else {
                alert('Erreur IA : ' + (json.message || 'Génération échouée'));
              }
            } catch (err) {
              alert('Erreur de connexion avec le service IA');
            } finally {
              btnSpan.textContent = oldText;
              triggerAiBtn.disabled = false;
              triggerAiBtn.style.opacity = '1';
            }
          };

          // Final Devis Submission Button
          const submitFinalBtn = document.getElementById('submit-devis-final-btn');
          submitFinalBtn.onclick = async function() {
            const desc = document.getElementById('ai-description').value.trim();
            const ht = parseFloat(htInput.value);

            if (!desc) {
              alert('Veuillez remplir la description du devis.');
              return;
            }

            const rate = parseFloat(tvaInput.value) || 21;
            const tvaVal = Math.round((ht * rate / 100) * 100) / 100;
            const ttcVal = Math.round((ht + tvaVal) * 100) / 100;

            submitFinalBtn.disabled = true;
            submitFinalBtn.innerHTML = '<span>Transmission en cours...</span>';

            try {
              const res = await fetch(API_BASE + '/devis-soumis/soumettre', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                  demande_devis_id: demandeId,
                  montant_ht: ht || 0,
                  taux_tva: rate,
                  montant_tva: tvaVal || 0,
                  montant_ttc: ttcVal || 0,
                  montant: ttcVal || ht || 0,
                  delai_realisation: document.getElementById('ai-delai').value,
                  description: desc
                })
              });

              const json = await res.json();
              if (json.success) {
                alert('✅ Félicitations ! Votre devis a été rédigé et envoyé au client avec succès.');
                backdrop.remove();
                window.location.reload();
              } else {
                alert('Erreur : ' + (json.message || 'Échec de l\'envoi du devis'));
                submitFinalBtn.disabled = false;
                submitFinalBtn.innerHTML = '<span>🚀 Envoyer le devis au client</span>';
              }
            } catch (err) {
              alert('Erreur réseau lors de la soumission');
              submitFinalBtn.disabled = false;
              submitFinalBtn.innerHTML = '<span>🚀 Envoyer le devis au client</span>';
            }
          };
        };

        // 2. CLIENT RESPONSE PAGE (GET /reponse-devis?token=...&action=...)
        async function initClientResponsePage() {
          if (window.location.pathname !== '/reponse-devis') return;

          const urlParams = new URLSearchParams(window.location.search);
          const token = urlParams.get('token');
          const directAction = urlParams.get('action');

          const root = document.getElementById('root') || document.body;
          root.innerHTML = '<div style="min-height:100vh;background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,system-ui,sans-serif;"><div id="client-devis-card" style="background:#fff;padding:30px;border-radius:24px;max-width:650px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.08);border:1px solid #e2e8f0;text-align:center;">Chargement de la proposition de devis...</div></div>';

          const card = document.getElementById('client-devis-card');

          if (!token) {
            card.innerHTML = '<h2 style="color:#ef4444">Lien de devis invalide</h2><p>Le jeton de validation est manquant.</p>';
            return;
          }

          try {
            const res = await fetch(API_BASE + '/devis-soumis/by-token?token=' + encodeURIComponent(token));
            const json = await res.json();

            if (!json.success || !json.data) {
              card.innerHTML = '<h2 style="color:#ef4444">Devis introuvable</h2><p>Ce lien de devis est expiré ou n\'existe plus.</p>';
              return;
            }

            const d = json.data;
            const ht = parseFloat(d.montant_ht || 0).toFixed(2);
            const tvaRate = d.taux_tva || 21;
            const tva = parseFloat(d.montant_tva || 0).toFixed(2);
            const ttc = parseFloat(d.montant_ttc || d.montant || 0).toFixed(2);

            let actionHtml = '';
            if (d.statut === 'accepte') {
              actionHtml = '<div style="background:#dcfce7;color:#166534;padding:16px;border-radius:14px;font-weight:800;font-size:16px;">✅ Vous avez déjà ACCEPTÉ ce devis. Le prestataire vous recontactera très rapidement.</div>';
            } else if (d.statut === 'refuse') {
              actionHtml = '<div style="background:#fef2f2;color:#991b1b;padding:16px;border-radius:14px;font-weight:800;font-size:16px;">❌ Vous avez REFUSÉ ce devis.</div>';
            } else {
              actionHtml = `
                <div style="background:#eff6ff;padding:20px;border-radius:16px;margin-top:20px;">
                  <h3 style="margin:0 0 12px;color:#1e40af;font-size:16px;">Quelle est votre décision ?</h3>
                  <div style="margin-bottom:15px;">
                    <textarea id="client-comment" placeholder="Ajouter une remarque pour le prestataire (optionnel)..." style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:13px;box-sizing:border-box;font-family:inherit;"></textarea>
                  </div>
                  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                    <button id="btn-client-accept" style="background:#16a34a;color:#fff;border:0;padding:12px 24px;border-radius:999px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 6px 16px rgba(22,163,74,0.25);">
                      ✅ ACCEPTER LE DEVIS (${ttc} € TTC)
                    </button>
                    <button id="btn-client-refuse" style="background:#dc2626;color:#fff;border:0;padding:12px 24px;border-radius:999px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 6px 16px rgba(220,38,38,0.25);">
                      ❌ REFUSER LE DEVIS
                    </button>
                  </div>
                </div>
              `;
            }

            card.innerHTML = `
              <div style="text-align:left;">
                <span style="background:#e0f2fe;color:#044CF3;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;text-transform:uppercase;">Devis Indebel Belgique</span>
                <h1 style="margin:10px 0 4px;font-size:22px;color:#0f172a;">${esc(d.type_travaux)}</h1>
                <p style="margin:0 0 20px;color:#64748b;font-size:14px;">Proposé par <strong>${esc(d.provider_name)}</strong> pour <strong>${esc(d.client_name)}</strong></p>

                <div style="background:#f8fafc;border:1px solid #e2e8f0;padding:18px;border-radius:16px;margin-bottom:20px;">
                  <div style="font-weight:800;color:#0f172a;margin-bottom:8px;font-size:15px;">Détails Financiers</div>
                  <table style="width:100%;font-size:14px;border-collapse:collapse;">
                    <tr><td style="color:#64748b;padding:3px 0;">Montant HT :</td><td style="text-align:right;font-weight:700;">${ht} €</td></tr>
                    <tr><td style="color:#64748b;padding:3px 0;">TVA (${tvaRate}%) :</td><td style="text-align:right;font-weight:700;">${tva} €</td></tr>
                    <tr style="border-top:1px solid #e2e8f0;"><td style="color:#044CF3;font-weight:800;padding:8px 0 3px;font-size:16px;">Total TTC :</td><td style="text-align:right;font-weight:900;color:#044CF3;font-size:18px;">${ttc} €</td></tr>
                  </table>
                  <p style="margin:10px 0 0;font-size:13px;color:#475569;"><strong>Délai estimé :</strong> ${esc(d.delai_realisation || 'Non spécifié')}</p>
                </div>

                <div style="margin-bottom:20px;">
                  <div style="font-weight:800;color:#0f172a;margin-bottom:6px;font-size:14px;">Description de la prestation</div>
                  <div style="background:#fff;border:1px solid #e2e8f0;padding:14px;border-radius:12px;font-size:13px;color:#334155;white-space:pre-wrap;line-height:1.5;">${esc(d.description)}</div>
                </div>

                ${actionHtml}
              </div>
            `;

            if (d.statut === 'en_attente') {
              const submitResponse = async (act) => {
                const comment = document.getElementById('client-comment')?.value || '';
                try {
                  const r = await fetch(API_BASE + '/devis-soumis/reponse-client', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, action: act, commentaire: comment })
                  });
                  const j = await r.json();
                  if (j.success) {
                    alert(j.message);
                    window.location.reload();
                  } else {
                    alert('Erreur : ' + j.message);
                  }
                } catch (e) {
                  alert('Erreur réseau');
                }
              };

              const btnAcc = document.getElementById('btn-client-accept');
              const btnRef = document.getElementById('btn-client-refuse');
              if (btnAcc) btnAcc.onclick = () => submitResponse('accepter');
              if (btnRef) btnRef.onclick = () => submitResponse('refuser');

              if (directAction === 'accepter' || directAction === 'refuser') {
                setTimeout(() => {
                  if (confirm(`Confirmez-vous vouloir ${directAction === 'accepter' ? 'ACCEPTER' : 'REFUSER'} ce devis de ${ttc} € TTC ?`)) {
                    submitResponse(directAction);
                  }
                }, 300);
              }
            }

          } catch (e) {
            card.innerHTML = '<h2 style="color:#ef4444">Erreur de chargement</h2><p>Impossible de contacter le serveur.</p>';
          }
        }

        window.addEventListener('load', initClientResponsePage);
        window.addEventListener('popstate', initClientResponsePage);

        // 3. OBSERVER & TRACKER DE POPUPS "Votre proposition" / "Soumettre un devis"
        let activeDemandeIdForAI = null;

        document.addEventListener('click', function(e) {
          const clickable = e.target.closest('[data-demande-id], [data-id], .bg-white.rounded-xl, a[href*="/devis/"], button');
          if (clickable) {
            const href = clickable.getAttribute('href') || (clickable.querySelector && clickable.querySelector('a') && clickable.querySelector('a').getAttribute('href'));
            if (href && href.includes('/devis/')) {
              const match = href.match(/\/devis\/(\d+)/);
              if (match) activeDemandeIdForAI = match[1];
            } else if (clickable.dataset && (clickable.dataset.demandeId || clickable.dataset.id)) {
              activeDemandeIdForAI = clickable.dataset.demandeId || clickable.dataset.id;
            }
          }

          const pageMatch = window.location.pathname.match(/\/devis\/(\d+)/);
          if (pageMatch) {
            activeDemandeIdForAI = pageMatch[1];
          }
        }, true);

        function checkAndInjectAIButtonInModals() {
          const pageMatch = window.location.pathname.match(/\/devis\/(\d+)/);
          if (pageMatch) activeDemandeIdForAI = pageMatch[1];

          const modalTitles = Array.from(document.querySelectorAll('h1, h2, h3, h4, div'));
          const targetHeader = modalTitles.find(el => {
            const txt = (el.innerText || '').trim();
            return (txt === 'Votre proposition' || txt === 'Soumettre un devis' || txt.includes('proposition pour'));
          });

          if (targetHeader) {
            const modalContainer = targetHeader.closest('div[role="dialog"], .fixed, .modal, .bg-white') || targetHeader.parentElement;
            if (modalContainer && !modalContainer.querySelector('.indebel-ai-modal-btn-injected')) {

              const btnWrapper = document.createElement('div');
              btnWrapper.className = 'indebel-ai-modal-btn-injected';
              btnWrapper.style.cssText = 'margin:12px 0 16px;padding:0 4px;';
              btnWrapper.innerHTML = `
                <button type="button" style="width:100%;padding:12px 18px;border-radius:14px;border:0;background:linear-gradient(135deg, #044CF3 0%, #7c3aed 100%);color:#ffffff;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 6px 20px rgba(4,76,243,0.3);display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/></svg>
                  <span>✨ Rédiger ce devis automatiquement avec l'IA (ai.lestagiaire.be)</span>
                </button>
              `;

              targetHeader.insertAdjacentElement('afterend', btnWrapper);

              btnWrapper.querySelector('button').onclick = function() {
                const id = activeDemandeIdForAI || (window.location.pathname.match(/\/devis\/(\d+)/) || [])[1];
                if (id && window.openIndebelAIDevisModal) {
                  const closeBtn = modalContainer.querySelector('button[aria-label="Close"], button.close, button:first-child');
                  if (closeBtn && typeof closeBtn.click === 'function') {
                    try { closeBtn.click(); } catch(e){}
                  }
                  window.openIndebelAIDevisModal(id);
                } else {
                  alert("Veuillez sélectionner une demande de devis.");
                }
              };
            }
          }
        }

        setInterval(checkAndInjectAIButtonInModals, 400);
      })();
    </script>
</body>
</html>
